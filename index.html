<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hotel BuSan KhacHieu — 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8eb6c2;font-family:Arial,sans-serif}
#game{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:white}
.top{pointer-events:auto;position:absolute;left:10px;right:10px;top:10px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.card{background:rgba(18,31,48,.82);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:16px;box-shadow:0 8px 25px #0004}
.profile{padding:8px 11px;min-width:175px}.profile b{font-size:15px}.profile small{opacity:.78}.xp{height:6px;background:#4b5b70;border-radius:9px;margin-top:6px;overflow:hidden}.xp i{display:block;width:54%;height:100%;background:#59c9ff}
.stats{display:flex;gap:5px}.stat{padding:9px 10px;font-weight:800;font-size:12px}
.buttons{position:absolute;right:10px;top:75px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.btn{min-width:58px;min-height:52px;border:0;border-radius:17px;background:rgba(18,31,48,.84);color:#fff;border:1px solid #ffffff30;box-shadow:0 7px 18px #0004;font-weight:800}
.btn span{display:block;font-size:21px}.btn small{font-size:9px}
.bottom{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:7px;align-items:end;pointer-events:auto}
.action{flex:1;min-height:54px;border:0;border-radius:16px;background:linear-gradient(#fff,#e8e3d7);color:#203047;font-weight:900;box-shadow:0 7px 16px #0004}.action span{font-size:21px;display:block}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:80px;padding:8px 12px;border-radius:13px;background:#111c2dcc;font-size:11px;opacity:.9}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#79a8bd,#dce7d7);z-index:20;color:#fff;text-align:center}
.loader{padding:24px 28px;border-radius:20px;background:#16273cdd;box-shadow:0 15px 50px #0005}
#panel{display:none;position:fixed;inset:0;z-index:30;background:#0b1624aa;backdrop-filter:blur(5px);align-items:end;justify-content:center}
.sheet{width:min(700px,94%);margin-bottom:12px;padding:18px;border-radius:22px;background:#fff9eb;color:#203047;box-shadow:0 20px 60px #0006}
.sheet h2{margin:0 0 10px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e8dfce;font-size:13px}.close{width:100%;padding:12px;margin-top:12px;border:0;border-radius:13px;background:#f0b83e;font-weight:900}
@media(max-width:600px){.profile{min-width:135px}.stats .stat:nth-child(2){display:none}.top{top:7px}.buttons{right:7px;top:72px}.btn{min-width:50px;min-height:48px}.action{font-size:11px}.action span{font-size:18px}#hint{bottom:74px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading"><div class="loader"><div style="font-size:42px">🏨</div><b>Hotel BuSan KhacHieu 3D</b><div style="margin-top:7px;font-size:12px;opacity:.75">Đang dựng khách sạn...</div></div></div>

<div id="hud">
  <div class="top">
    <div class="card profile"><b id="hotelName">Hotel BuSan KhacHieu</b><br><small>Lv. <span id="level">5</span> · Chủ khách sạn</small><div class="xp"><i></i></div></div>
    <div class="stats">
      <div class="card stat">💵 <span id="money">12,580</span></div>
      <div class="card stat">💎 245</div>
      <div class="card stat">⭐ 4.2</div>
    </div>
  </div>
  <div class="buttons">
    <button class="btn" id="mapBtn"><span>🗺️</span><small>Bản đồ</small></button>
    <button class="btn" id="photoBtn"><span>📷</span><small>Góc nhìn</small></button>
    <button class="btn" id="renameBtn"><span>✏️</span><small>Đổi tên</small></button>
  </div>
  <div id="hint">Kéo để xoay • Vuốt 2 ngón để phóng/thu • Chạm nút để tương tác</div>
  <div class="bottom">
    <button class="action" id="hotelBtn"><span>🏨</span>Khách sạn</button>
    <button class="action" id="roomBtn"><span>🛏️</span>Phòng</button>
    <button class="action" id="foodBtn"><span>🍽️</span>Nhà hàng</button>
    <button class="action" id="poolBtn"><span>🏊</span>Hồ bơi</button>
    <button class="action" id="staffBtn"><span>👨‍🍳</span>Nhân viên</button>
    <button class="action" id="upgradeBtn"><span>⬆️</span>Nâng cấp</button>
  </div>
</div>

<div id="panel"><div class="sheet"><h2 id="ptitle">Hotel BuSan KhacHieu</h2><div id="pbody"></div><button class="close" id="close">Đóng</button></div></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";

const root=document.getElementById("game");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fc8d3);
scene.fog=new THREE.Fog(0x9fc8d3,38,90);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,180);
camera.position.set(25,19,28);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
root.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,4,0); controls.enableDamping=true; controls.dampingFactor=.075;
controls.minDistance=14; controls.maxDistance=55; controls.maxPolarAngle=Math.PI*.47;
controls.minPolarAngle=.18;

const hemi=new THREE.HemisphereLight(0xdff4ff,0x526044,1.7); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe1a5,4.2);
sun.position.set(-18,30,15); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;
sun.shadow.bias=-.00025;scene.add(sun);

function mat(c,rough=.7,metal=0){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal})}
const white=mat(0xf5efe0,.78), cream=mat(0xdcc9a2), dark=mat(0x5a3a26), glass= new THREE.MeshPhysicalMaterial({color:0x6fc9e5,roughness:.12,metalness:.1,transmission:.12,transparent:true,opacity:.8}), green=mat(0x39714d), gold=mat(0xd8a63d,.3,.5);

function box(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;scene.add(o);return o}
function cyl(r,h,m,x,y,z,seg=24){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;scene.add(o);return o}

const ground=box(100,.6,100,mat(0x688866),0,-.35,0);
const plaza=box(54,.22,42,mat(0xc7b99b),0,.05,5);
const road=box(100,.15,9,mat(0x303b46),0,.15,24);
for(let x=-42;x<43;x+=7)box(4,.03,.22,mat(0xe9ddad),x,.25,24);

function buildHotel(){
  box(22,13,12,white,0,6.7,0);
  box(32,7,9,white,-17,3.8,1);
  box(30,8,9,white,16,4.2,0);
  for(const y of [3.2,7.1,11]){box(23,.45,12,gold,0,y,0)}
  for(const x of [-8,-4,0,4,8]) for(const y of [4.5,8.4,12.1]) box(2.1,2.6,.22,glass,x,y,6.08);
  for(const x of [-24,-19,-14]) for(const y of [3.5,7]) box(2.1,2.6,.22,glass,x,y,5.58);
  for(const x of [12,17,22]) for(const y of [4,8]) box(2.1,2.6,.22,glass,x,y,4.58);
  const canopy=box(9,.55,4.5,dark,0,10.1,6.5);
  box(6,.6,2.8,gold,0,10.55,6.5);
  const sign=box(12,3.2,.45,dark,0,10.2,6.9);
  const glow=new THREE.MeshStandardMaterial({color:0xffc94d,emissive:0xffa52e,emissiveIntensity:2});
  box(10,2.2,.12,glow,0,10.2,7.16);
  for(const x of [-6,6]){box(.45,3.4,.45,dark,x,1.7,6.7)}
  box(7.5,3.2,.5,dark,0,1.7,6.8);
}
buildHotel();

function addRoof(x,z,w,d,y=14.2){const r=new THREE.Mesh(new THREE.BoxGeometry(w,.8,d),mat(0x7d3035));r.position.set(x,y,z);r.rotation.z=.01;r.castShadow=true;scene.add(r)}
addRoof(0,0,24,13);addRoof(-17,1,33,10,8);addRoof(16,0,31,10,9);

function tree(x,z,s=1){
 const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.28,.4,3.2,10),mat(0x68442a));trunk.position.y=1.6;trunk.castShadow=true;g.add(trunk);
 for(const [yy,rr] of [[3,.95],[4,1.15],[5,1.0]]){const c=new THREE.Mesh(new THREE.SphereGeometry(rr,16,12),mat(0x3f8753));c.position.set((Math.random()-.5)*.3,yy,(Math.random()-.5)*.3);c.castShadow=true;g.add(c)}
 scene.add(g)
}
for(const p of [[-25,-6,1.3],[-29,9,1.5],[28,9,1.4],[25,-6,1.2],[-9,13,.8],[10,13,.8]])tree(...p);

function palm(x,z,s=1){
 const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);
 const t=new THREE.Mesh(new THREE.CylinderGeometry(.18,.3,4.5,10),mat(0x70462a));t.position.y=2.25;t.rotation.z=-.08;t.castShadow=true;g.add(t);
 for(let i=0;i<7;i++){const leaf=new THREE.Mesh(new THREE.BoxGeometry(.22,2.7,.08),mat(0x3b8650));leaf.position.y=4.65;leaf.rotation.z=(i/7)*Math.PI*2;leaf.rotation.x=-.45;leaf.castShadow=true;g.add(leaf)}
 scene.add(g)
}
[[-18,8,1],[-13,-6,1.1],[13,-6,1.1],[22,5,.9],[8,10,.7]].forEach(p=>palm(...p));

function pool(){
 const base=new THREE.Mesh(new THREE.BoxGeometry(19,.55,11),mat(0xe7d5a5));base.position.set(11,.35,-9);base.castShadow=true;scene.add(base);
 const water=new THREE.Mesh(new THREE.BoxGeometry(17,.18,9),new THREE.MeshPhysicalMaterial({color:0x18b9e0,roughness:.12,metalness:.05,transmission:.2,transparent:true,opacity:.88}));
 water.position.set(11,.7,-9);water.receiveShadow=true;scene.add(water);
 for(const x of [3.5,9,14.5,20]){const s=new THREE.Mesh(new THREE.BoxGeometry(.6,1.3,.6),mat(0xd9c19a));s.position.set(x,1.05,-15);s.castShadow=true;scene.add(s)}
}
pool();

function fountain(){
 const b=cyl(2.2,.55,cream,-11,.5,-8,32);const w=cyl(1.7,.12,glass,-11,.82,-8,32);
 const jet=new THREE.Mesh(new THREE.CylinderGeometry(.08,.2,2.6,12),new THREE.MeshStandardMaterial({color:0xa9efff,transparent:true,opacity:.72}));
 jet.position.set(-11,2.05,-8);scene.add(jet);
}
fountain();

function car(){
 const g=new THREE.Group();g.position.set(-5,.8,13);
 const body=new THREE.Mesh(new THREE.BoxGeometry(4.5,1.1,2.2),mat(0x18212c,.35,.2));body.castShadow=true;g.add(body);
 const top=new THREE.Mesh(new THREE.BoxGeometry(2.6,.85,1.8),glass);top.position.y=.9;top.castShadow=true;g.add(top);
 for(const x of [-1.5,1.5])for(const z of [-1.12,1.12]){const w=cyl(.42,.25,dark,x,0,z,20);w.rotation.x=Math.PI/2;w.castShadow=true;g.add(w)}
 scene.add(g)
}
car();

function makeCharacter(x,z,color){
 const g=new THREE.Group();g.position.set(x,0,z);
 const shirt=mat(color), skin=mat(0xf0bd91), pants=mat(0x34455a);
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,1.05,6,10),shirt);body.position.y=1.45;body.castShadow=true;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.42,16,12),skin);head.position.y=2.55;head.castShadow=true;g.add(head);
 const leg1=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.72,5,8),pants);leg1.position.set(-.18,.55,0);leg1.castShadow=true;g.add(leg1);
 const leg2=leg1.clone();leg2.position.x=.18;g.add(leg2);
 scene.add(g);return g
}
const people=[
 {g:makeCharacter(-3,4,0x4d88d5),a:-3,b:4,s:1.2},
 {g:makeCharacter(4,6,0xe05b68),a:4,b:6,s:.9},
 {g:makeCharacter(16,3,0x48a66c),a:16,b:3,s:1.0},
 {g:makeCharacter(-15,5,0xe6a53e),a:-15,b:5,s:1.15}
];
people.forEach((p,i)=>p.g.userData={i,baseX:p.a,baseZ:p.b,t:Math.random()*10});

function lamp(x,z){
 const pole=cyl(.1,3.1,dark,x,1.55,z,10);
 const light=new THREE.PointLight(0xffd78a,2.2,8);light.position.set(x,3.5,z);scene.add(light);
 const bulb=new THREE.Mesh(new THREE.SphereGeometry(.22,12,8),new THREE.MeshStandardMaterial({color:0xffd87b,emissive:0xff9f30,emissiveIntensity:3}));bulb.position.copy(light.position);scene.add(bulb)
}
[[-22,15],[22,14],[-9,14],[9,14],[-15,-1],[23,-2]].forEach(p=>lamp(...p));

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function selectAt(ev){
 const r=renderer.domElement.getBoundingClientRect();
 mouse.x=((ev.clientX-r.left)/r.width)*2-1;mouse.y=-((ev.clientY-r.top)/r.height)*2+1;
 ray.setFromCamera(mouse,camera);
 const hit=ray.intersectObjects(people.flatMap(p=>p.g.children),false)[0];
 if(hit){show("Khách đang đi lại","Nhân vật này đang di chuyển trong khuôn viên Hotel BuSan KhacHieu.")}
}
renderer.domElement.addEventListener("pointerdown",selectAt);

function show(title,body){
 document.getElementById("ptitle").textContent=title;document.getElementById("pbody").innerHTML=body;
 document.getElementById("panel").style.display="flex";
}
document.getElementById("close").onclick=()=>document.getElementById("panel").style.display="none";
document.getElementById("mapBtn").onclick=()=>show("🗺️ Bản đồ","Bạn đang ở khu nghỉ dưỡng Hotel BuSan KhacHieu. Kéo màn hình để xoay camera và khám phá.");
document.getElementById("photoBtn").onclick=()=>{controls.target.set(0,4,0);camera.position.set(22,16,24);show("📷 Góc chụp","Đã chuyển sang góc nhìn toàn cảnh mặt tiền khách sạn.");};
document.getElementById("renameBtn").onclick=()=>{
 const old=document.getElementById("hotelName").textContent;const n=prompt("Tên khách sạn mới:",old);
 if(n&&n.trim()){document.getElementById("hotelName").textContent=n.trim();document.title=n.trim()+" — 3D";show("✏️ Đổi tên",`Tên mới: <b>${n.trim().replace(/[<>&"]/g,"")}</b>`)}
};
document.getElementById("hotelBtn").onclick=()=>show("🏨 Khách sạn","Bạn đang xem toàn cảnh khách sạn 3D. Xoay camera để khám phá.");
document.getElementById("roomBtn").onclick=()=>show("🛏️ Phòng","12 phòng đang được mô phỏng trong khu khách sạn. Nội thất có thể mở rộng ở phiên bản tiếp theo.");
document.getElementById("foodBtn").onclick=()=>show("🍽️ Nhà hàng","Nhà hàng nằm ở tầng trệt, phía bên phải khu sảnh.");
document.getElementById("poolBtn").onclick=()=>{controls.target.set(11,1,-9);camera.position.set(29,12,-2);show("🏊 Hồ bơi 3D","Hồ bơi có mặt nước, ánh sáng và phản chiếu môi trường cơ bản.");};
document.getElementById("staffBtn").onclick=()=>show("👨‍🍳 Nhân viên","Nhân viên và khách đang di chuyển trong khuôn viên.");
document.getElementById("upgradeBtn").onclick=()=>show("⬆️ Nâng cấp","Nâng cấp mặt tiền, phòng, nhà hàng và hồ bơi có thể được nối vào hệ thống kinh tế của game.");

let clock=new THREE.Clock(),paused=false;
function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();
 people.forEach((p,i)=>{
   const g=p.g;
   g.position.x=p.baseX+Math.sin(t*.55+p.t)*2.2;
   g.position.z=p.baseZ+Math.cos(t*.42+p.t)*1.7;
   g.rotation.y=Math.sin(t*.55+p.t)*.6;
   g.position.y=Math.abs(Math.sin(t*3+p.t))*.035;
 });
 controls.update();renderer.render(scene,camera);
}
window.addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8))});
document.getElementById("loading").style.display="none";
animate();
</script>
</body>
</html>
