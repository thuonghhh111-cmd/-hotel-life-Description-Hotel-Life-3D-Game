<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Hotel BuSan KhacHieu 3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#8fc4d8;
}

canvas{
    display:block;
}

#game{
    position:fixed;
    inset:0;
}

#loading{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(#83bdd1,#d9eee6);
}

.loading-box{
    width:min(420px,85vw);
    padding:30px;
    border-radius:28px;
    background:#24374c;
    color:white;
    text-align:center;
    box-shadow:0 20px 60px #0005;
}

.loading-icon{
    font-size:55px;
    margin-bottom:12px;
}

.loading-title{
    font-size:25px;
    font-weight:800;
}

.loading-text{
    margin-top:10px;
    color:#cbd6e1;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
}

.topbar{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.profile{
    display:flex;
    align-items:center;
    gap:10px;
    background:#203348dd;
    color:white;
    padding:8px 13px 8px 8px;
    border-radius:18px;
    box-shadow:0 5px 20px #0004;
    pointer-events:auto;
}

.avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    background:linear-gradient(145deg,#ffd9a8,#ff9c79);
    border:3px solid white;
}

.hotel-info b{
    display:block;
    font-size:17px;
}

.level{
    margin-top:4px;
    font-size:12px;
    color:#d7e5ef;
}

.xp{
    width:120px;
    height:6px;
    background:#ffffff33;
    border-radius:10px;
    margin-top:5px;
    overflow:hidden;
}

.xp i{
    display:block;
    width:55%;
    height:100%;
    background:#65d8ff;
}

.stats{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.stat{
    padding:10px 13px;
    border-radius:16px;
    background:#203348dd;
    color:white;
    font-weight:700;
    box-shadow:0 5px 20px #0003;
}

.green{color:#70e37b}
.purple{color:#db9aff}
.gold{color:#ffd86a}

.left-buttons,
.right-buttons{
    position:absolute;
    top:105px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.left-buttons{left:14px}
.right-buttons{right:14px}

.ui-btn{
    pointer-events:auto;
    border:0;
    width:62px;
    min-height:62px;
    border-radius:19px;
    background:#203348e8;
    color:white;
    font-weight:700;
    box-shadow:0 6px 18px #0004;
    cursor:pointer;
}

.ui-btn .icon{
    display:block;
    font-size:25px;
    margin-bottom:2px;
}

.bottom-menu{
    position:absolute;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
    padding:8px;
    background:#203348dd;
    border-radius:25px;
    pointer-events:auto;
    box-shadow:0 8px 25px #0005;
}

.menu-btn{
    border:0;
    min-width:72px;
    height:68px;
    border-radius:18px;
    background:#ffffffee;
    color:#26384b;
    font-weight:700;
    cursor:pointer;
}

.menu-btn .icon{
    display:block;
    font-size:27px;
    margin-bottom:3px;
}

#joystick{
    position:absolute;
    left:25px;
    bottom:110px;
    width:125px;
    height:125px;
    border-radius:50%;
    background:#ffffff22;
    border:2px solid #ffffff55;
    pointer-events:auto;
    touch-action:none;
}

#stick{
    position:absolute;
    width:55px;
    height:55px;
    border-radius:50%;
    left:35px;
    top:35px;
    background:#ffffffbb;
    box-shadow:0 5px 15px #0003;
}

#hint{
    position:absolute;
    bottom:105px;
    right:20px;
    color:white;
    background:#203348bb;
    padding:10px 14px;
    border-radius:14px;
    font-size:13px;
}

.modal{
    position:fixed;
    inset:0;
    z-index:50;
    display:none;
    align-items:center;
    justify-content:center;
    background:#07132188;
    padding:20px;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:min(430px,94vw);
    background:#f7fafc;
    border-radius:25px;
    padding:22px;
    box-shadow:0 25px 70px #0007;
}

.modal-box h2{
    margin-top:0;
    color:#203348;
}

.modal-box input{
    width:100%;
    padding:15px;
    border:2px solid #dce4ea;
    border-radius:14px;
    font-size:17px;
    outline:none;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.modal-actions button{
    flex:1;
    border:0;
    padding:14px;
    border-radius:14px;
    font-weight:700;
}

.cancel{background:#e8edf1}
.confirm{background:#f3ad35;color:white}

.toast{
    position:fixed;
    left:50%;
    top:90px;
    transform:translateX(-50%) translateY(-20px);
    z-index:80;
    background:#203348ee;
    color:white;
    padding:12px 20px;
    border-radius:16px;
    opacity:0;
    transition:.25s;
    pointer-events:none;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(max-width:700px){
    .stats{
        max-width:210px;
    }

    .stat{
        padding:8px 10px;
        font-size:12px;
    }

    .profile{
        max-width:185px;
    }

    .hotel-info b{
        font-size:14px;
    }

    .bottom-menu{
        max-width:96vw;
        overflow-x:auto;
    }

    .menu-btn{
        min-width:62px;
        height:60px;
        font-size:11px;
    }

    #hint{
        display:none;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
    <div class="loading-box">
        <div class="loading-icon">🏨</div>
        <div class="loading-title">Hotel BuSan KhacHieu 3D</div>
        <div class="loading-text">Đang dựng khách sạn...</div>
    </div>
</div>

<div id="ui">

    <div class="topbar">

        <div class="profile">
            <div class="avatar">👩🏻</div>

            <div class="hotel-info">
                <b id="hotelName">Hotel BuSan KhacHieu</b>
                <div class="level">Lv. 5 · 320/600 XP</div>
                <div class="xp"><i></i></div>
            </div>
        </div>

        <div class="stats">
            <div class="stat green">💵 <span id="money">12,580</span></div>
            <div class="stat purple">💎 245</div>
            <div class="stat gold">⭐ 4.8</div>
        </div>

    </div>

    <div class="left-buttons">
        <button class="ui-btn" onclick="showToast('Bạn chưa có nhiệm vụ mới!')">
            <span class="icon">📋</span>
            Nhiệm vụ
        </button>

        <button class="ui-btn" onclick="showToast('Bạn nhận được 1 phần quà! 🎁')">
            <span class="icon">🎁</span>
            Quà
        </button>

        <button class="ui-btn" onclick="showToast('VIP Hotel đang hoạt động 👑')">
            <span class="icon">👑</span>
            VIP
        </button>
    </div>

    <div class="right-buttons">
        <button class="ui-btn" onclick="resetCamera()">
            <span class="icon">🎥</span>
            Camera
        </button>

        <button class="ui-btn" onclick="showToast('Bản đồ khách sạn đang được mở...')">
            <span class="icon">🗺️</span>
            Bản đồ
        </button>

        <button class="ui-btn" onclick="toggleNight()">
            <span class="icon">🌙</span>
            Ngày/Đêm
        </button>
    </div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="hint">
        🖱️ Kéo để xoay camera · Cuộn để zoom · WASD để đi
    </div>

    <div class="bottom-menu">

        <button class="menu-btn" onclick="focusHotel()">
            <span class="icon">🏨</span>
            Khách sạn
        </button>

        <button class="menu-btn" onclick="focusRooms()">
            <span class="icon">🛏️</span>
            Phòng
        </button>

        <button class="menu-btn" onclick="focusRestaurant()">
            <span class="icon">🍽️</span>
            Nhà hàng
        </button>

        <button class="menu-btn" onclick="focusPool()">
            <span class="icon">🏊</span>
            Hồ bơi
        </button>

        <button class="menu-btn" onclick="showToast('Nhân viên đang làm việc 👨‍🍳')">
            <span class="icon">👨🏻</span>
            Nhân viên
        </button>

        <button class="menu-btn" onclick="openRename()">
            <span class="icon">✏️</span>
            Đổi tên
        </button>

    </div>
</div>

<div id="renameModal" class="modal">
    <div class="modal-box">
        <h2>🏨 Đổi tên khách sạn</h2>

        <input
            id="nameInput"
            maxlength="30"
            placeholder="Nhập tên khách sạn..."
        >

        <div class="modal-actions">
            <button class="cancel" onclick="closeRename()">Hủy</button>
            <button class="confirm" onclick="renameHotel()">Xác nhận</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* =========================================================
   KHỞI TẠO THREE.JS
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x8fc4d8);

scene.fog = new THREE.Fog(
    0x8fc4d8,
    70,
    180
);

const camera = new THREE.PerspectiveCamera(
    55,
    innerWidth / innerHeight,
    0.1,
    500
);

camera.position.set(
    42,
    38,
    48
);

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.1;

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* =========================================================
   CAMERA
========================================================= */

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.target.set(
    0,
    5,
    0
);

controls.enableDamping = true;
controls.dampingFactor = .07;

controls.minDistance = 18;
controls.maxDistance = 95;

controls.maxPolarAngle =
    Math.PI * .48;


/* =========================================================
   LIGHT
========================================================= */

const hemi = new THREE.HemisphereLight(
    0xbdeaff,
    0x466044,
    2.1
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
    0xffe0a5,
    4
);

sun.position.set(
    -35,
    65,
    30
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;

sun.shadow.bias = -0.0004;

scene.add(sun);


/* =========================================================
   MATERIALS
========================================================= */

function mat(color, rough=.7){
    return new THREE.MeshStandardMaterial({
        color,
        roughness:rough,
        metalness:.05
    });
}

const grassMat =
    mat(0x5f9255);

const roadMat =
    mat(0x303b45);

const wallMat =
    mat(0xe9d8bd);

const glassMat =
    new THREE.MeshPhysicalMaterial({
        color:0x7fcbe8,
        roughness:.08,
        metalness:.15,
        transparent:true,
        opacity:.62
    });

const roofMat =
    mat(0x6d493c);

const whiteMat =
    mat(0xf4eee4);

const goldMat =
    new THREE.MeshStandardMaterial({
        color:0xffc34e,
        metalness:.55,
        roughness:.25
    });

const waterMat =
    new THREE.MeshPhysicalMaterial({
        color:0x00aeea,
        roughness:.1,
        metalness:.05,
        transmission:.15,
        transparent:true,
        opacity:.82
    });

const darkMat =
    mat(0x273645);

const skinMat =
    mat(0xffc79b);

const shirtMat =
    mat(0x5d86c8);

const hairMat =
    mat(0x38271f);


/* =========================================================
   HELPER
========================================================= */

function box(
    x,
    y,
    z,
    px,
    py,
    pz,
    material,
    cast=true,
    receive=true
){
    const g =
        new THREE.BoxGeometry(x,y,z);

    const m =
        new THREE.Mesh(g,material);

    m.position.set(px,py,pz);

    m.castShadow = cast;
    m.receiveShadow = receive;

    scene.add(m);

    return m;
}

function cyl(
    radius,
    height,
    px,
    py,
    pz,
    material
){
    const g =
        new THREE.CylinderGeometry(
            radius,
            radius,
            height,
            24
        );

    const m =
        new THREE.Mesh(g,material);

    m.position.set(px,py,pz);

    m.castShadow=true;
    m.receiveShadow=true;

    scene.add(m);

    return m;
}


/* =========================================================
   MẶT ĐẤT
========================================================= */

box(
    180,
    1,
    180,
    0,
    -.5,
    0,
    grassMat,
    false,
    true
);


/* =========================================================
   ĐƯỜNG
========================================================= */

box(
    180,
    .15,
    18,
    0,
    .05,
    40,
    roadMat,
    false,
    true
);

box(
    18,
    .15,
    180,
    -55,
    .06,
    0,
    roadMat,
    false,
    true
);


/* =========================================================
   SÂN KHÁCH SẠN
========================================================= */

box(
    48,
    .25,
    35,
    0,
    .12,
    8,
    mat(0xd1b99b),
    false
);


/* =========================================================
   KHỐI KHÁCH SẠN
========================================================= */

const hotel = new THREE.Group();

scene.add(hotel);


/* Tầng 1 */

const floor1 =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            38,8,22
        ),
        wallMat
    );

floor1.position.y = 4;

floor1.castShadow=true;
floor1.receiveShadow=true;

hotel.add(floor1);


/* Tầng 2 */

const floor2 =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            34,7,20
        ),
        whiteMat
    );

floor2.position.y = 11.5;

floor2.castShadow=true;
floor2.receiveShadow=true;

hotel.add(floor2);


/* Tầng 3 */

const floor3 =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            29,6.5,18
        ),
        wallMat
    );

floor3.position.y = 18.25;

floor3.castShadow=true;
floor3.receiveShadow=true;

hotel.add(floor3);


/* =========================================================
   CỬA KÍNH
========================================================= */

for(let x=-14;x<=14;x+=7){

    const door =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.4,
                5.4,
                .15
            ),
            glassMat
        );

    door.position.set(
        x,
        3,
        -11.1
    );

    hotel.add(door);

    const frame =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.8,
                .18,
                .2
            ),
            darkMat
        );

    frame.position.set(
        x,
        5.7,
        -11.2
    );

    hotel.add(frame);
}


/* =========================================================
   BAN CÔNG
========================================================= */

for(let x=-12;x<=12;x+=8){

    const balcony =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                6,
                .35,
                3
            ),
            mat(0xcaa878)
        );

    balcony.position.set(
        x,
        15,
        -11
    );

    balcony.castShadow=true;

    hotel.add(balcony);

    for(let p=-2;p<=2;p+=1){

        const rail =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .06,.06,1.4,8
                ),
                darkMat
            );

        rail.position.set(
            x+p,
            15.7,
            -12.2
        );

        hotel.add(rail);
    }
}


/* =========================================================
   MÁI
========================================================= */

const roof =
    new THREE.Mesh(
        new THREE.ConeGeometry(
            22,
            6,
            4
        ),
        roofMat
    );

roof.rotation.y =
    Math.PI/4;

roof.position.y = 24;

roof.castShadow=true;

hotel.add(roof);


/* =========================================================
   BIỂN HOTEL
========================================================= */

const sign =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            15,
            4.8,
            .5
        ),
        goldMat
    );

sign.position.set(
    0,
    8,
    -12.2
);

sign.castShadow=true;

hotel.add(sign);


/* chữ bằng CanvasTexture */

function createTextTexture(
    text,
    size=512
){

    const canvas =
        document.createElement("canvas");

    canvas.width=size;
    canvas.height=180;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle="#5b321f";
    ctx.fillRect(
        0,0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle="#fff4d4";

    ctx.font=
        "bold 55px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
        text,
        canvas.width/2,
        canvas.height/2
    );

    return new THREE.CanvasTexture(
        canvas
    );
}

const signTexture =
    createTextTexture(
        "Hotel BuSan"
    );

const signMesh =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            13,
            4.2
        ),
        new THREE.MeshBasicMaterial({
            map:signTexture
        })
    );

signMesh.position.set(
    0,
    8,
    -12.5
);

hotel.add(signMesh);


/* =========================================================
   CỬA CHÍNH
========================================================= */

box(
    7,
    .3,
    4,
    0,
    .15,
    -14,
    mat(0x806b57),
    false
);

const entrance =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            6,
            5,
            .5
        ),
        glassMat
    );

entrance.position.set(
    0,
    2.8,
    -11.8
);

hotel.add(entrance);


/* =========================================================
   HỒ BƠI
========================================================= */

function createPool(){

    box(
        25,
        .5,
        15,
        29,
        .3,
        8,
        mat(0xc7c7b5),
        false
    );

    const water =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                22,
                .45,
                12
            ),
            waterMat
        );

    water.position.set(
        29,
        .65,
        8
    );

    water.receiveShadow=true;

    scene.add(water);

    /* đường viền */

    for(let x=-10;x<=10;x+=5){

        box(
            .5,
            .7,
            .5,
            29+x,
            .7,
            2,
            whiteMat
        );

        box(
            .5,
            .7,
            .5,
            29+x,
            .7,
            14,
            whiteMat
        );
    }

    /* ghế nằm */

    for(let i=0;i<5;i++){

        const lounger =
            new THREE.Group();

        const bed =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    2.5,.2,5
                ),
                whiteMat
            );

        bed.position.y=.8;

        lounger.add(bed);

        lounger.position.set(
            18+i*5,
            0,
            -1
        );

        scene.add(lounger);
    }
}

createPool();


/* =========================================================
   CÂY
========================================================= */

function createTree(x,z,s=1){

    const tree =
        new THREE.Group();

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .35*s,
                .5*s,
                3*s,
                10
            ),
            mat(0x70472b)
        );

    trunk.position.y=
        1.5*s;

    trunk.castShadow=true;

    tree.add(trunk);

    for(let i=0;i<3;i++){

        const leaf =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    2.1*s,
                    16,
                    12
                ),
                mat(0x39734b)
            );

        leaf.position.set(
            (Math.random()-.5)*1.5*s,
            (3+i*1.2)*s,
            (Math.random()-.5)*1.5*s
        );

        leaf.castShadow=true;

        tree.add(leaf);
    }

    tree.position.set(
        x,0,z
    );

    scene.add(tree);
}


/* nhiều cây */

[
    [-25,-8,1.2],
    [-30,15,1],

function createCharacter(){

    const person =
        new THREE.Group();

    /* chân */

    const leg1 =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .22,.25,1.7,12
            ),
            darkMat
        );

    leg1.position.set(
        -.25,
        .85,
        0
    );

    leg1.castShadow=true;

    person.add(leg1);

    const leg2 =
        leg1.clone();

    leg2.position.x=.25;

    person.add(leg2);


    /* thân */

    const body =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .7,.85,1.8,16
            ),
            shirtMat
        );

    body.position.y=2.1;

    body.castShadow=true;

    person.add(body);


    /* đầu */

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .62,
                24,
                18
            ),
            skinMat
        );

    head.position.y=3.65;

    head.castShadow=true;

    person.add(head);


    /* tóc */

    const hair =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .66,
                24,
                16,
                0,
                Math.PI*2,
                0,
                Math.PI*.58
            ),
            hairMat
        );

    hair.position.y=3.9;

    hair.castShadow=true;

    person.add(hair);


    /* mắt */

    for(const x of [-.2,.2]){

        const eye =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .055,
                    8,
                    8
                ),
                darkMat
            );

        eye.position.set(
            x,
            3.65,
            -.59
        );

        person.add(eye);
    }

    person.position.set(
        0,
        0,
        4
    );

    person.scale.set(
        1.25,
        1.25,
        1.25
    );

    scene.add(person);

    return person;
}

/* =========================================================
   JOYSTICK MOBILE
========================================================= */

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");

let joyX=0;
let joyY=0;
let joyActive=false;

function joystickMove(e){

    const rect =
        joystick.getBoundingClientRect();

    const touch =
        e.touches ? e.touches[0] : e;

    let x =
        touch.clientX -
        (rect.left+rect.width/2);

    let y =
        touch.clientY -
        (rect.top+rect.height/2);

    const max=35;

    const len =
        Math.sqrt(x*x+y*y);

    if(len>max){

        x=x/len*max;
        y=y/len*max;
    }

    stick.style.transform=
        `translate(${x}px,${y}px)`;

    joyX=x/max;
    joyY=y/max;
}

joystick.addEventListener(
    "touchstart",
    e=>{
        joyActive=true;
        joystickMove(e);
    },
    {passive:true}
);

joystick.addEventListener(
    "touchmove",
    e=>{
        if(joyActive)
            joystickMove(e);
    },
    {passive:true}
);

joystick.addEventListener(
    "touchend",
    ()=>{
        joyActive=false;
        joyX=0;
        joyY=0;
        stick.style.transform=
            "translate(0,0)";
    }
);


/* =========================================================
   DI CHUYỂN NHÂN VẬT
========================================================= */

const clock =
    new THREE.Clock();

function updatePlayer(){

    let x=0;
    let z=0;

    if(keys["w"] || keys["arrowup"])
        z-=1;

    if(keys["s"] || keys["arrowdown"])
        z+=1;

    if(keys["a"] || keys["arrowleft"])
        x-=1;

    if(keys["d"] || keys["arrowright"])
        x+=1;

    x+=joyX;
    z+=joyY;

    const length =
        Math.sqrt(x*x+z*z);

    if(length>0){

        x/=length;
        z/=length;

        const speed=.11;

        player.position.x +=
            x*speed;

        player.position.z +=
            z*speed;

        player.rotation.y =
            Math.atan2(
                x,
                z
            );

        /* giới hạn khu vực */

        player.position.x =
            THREE.MathUtils.clamp(
                player.position.x,
                -42,
                45
            );

        player.position.z =
            THREE.MathUtils.clamp(
                player.position.z,
                -25,
                38
            );
    }
}


/* =========================================================
   KHÁCH ĐI NGẪU NHIÊN
========================================================= */

function updateGuests(){

    guests.forEach(g=>{

        g.object.position.x +=
            Math.sin(g.angle)*
            g.speed;

        g.object.position.z +=
            Math.cos(g.angle)*
            g.speed;

        if(
            Math.abs(g.object.position.x)>45 ||
            Math.abs(g.object.position.z)>40
        ){
            g.angle += Math.PI;
        }

        g.object.rotation.y =
            g.angle;
    });
}

let toastTimer;

window.showToast=function(text){

    const toast =
        document.getElementById(

    toast.classList.add("show");

    clearTimeout(toastTimer);

        ()=>{

            );
        },

};

/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    const time =
        clock.getElapsedTime();

    updatePlayer();
    updateGuests();

    /* hiệu ứng nước */

    scene.traverse(
        object=>{

            if(
                object.material ===
                waterMat
            ){

                object.position.y =
                    .65+
                    Math.sin(time*1.7)*.035;
            }
        }
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );
}
