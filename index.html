<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Hotel Life 3D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#8fc8dc;
}

body{
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

/* ================= TOP UI ================= */

#topUI{
  position:absolute;
  top:max(12px,env(safe-area-inset-top));
  left:12px;
  right:12px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  pointer-events:none;
  z-index:10;
}

.profile{
  width:265px;
  min-height:92px;
  border-radius:25px;
  background:rgba(28,51,74,.94);
  box-shadow:0 8px 25px rgba(0,0,0,.22);
  color:white;
  padding:10px 14px 10px 9px;
  display:flex;
  align-items:center;
  gap:11px;
}

.avatar{
  width:68px;
  height:68px;
  border-radius:50%;
  background:linear-gradient(#ffe5ca,#fff);
  border:4px solid white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:42px;
  flex:none;
}

.profileText{
  min-width:0;
}

.hotelName{
  font-weight:800;
  font-size:20px;
  line-height:22px;
  white-space:normal;
}

.level{
  margin-top:4px;
  color:#dce8f0;
  font-size:15px;
}

.xpbar{
  height:9px;
  margin-top:6px;
  border-radius:10px;
  background:#5b7184;
  overflow:hidden;
}

.xpfill{
  height:100%;
  width:53%;
  background:linear-gradient(90deg,#55d8ff,#7de7ff);
  border-radius:10px;
}

.stats{
  display:flex;
  gap:9px;
  align-items:center;
}

.stat{
  height:62px;
  min-width:100px;
  padding:0 13px;
  border-radius:22px;
  background:rgba(28,51,74,.94);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-weight:800;
  font-size:18px;
  box-shadow:0 8px 22px rgba(0,0,0,.18);
}

.stat.money{color:#68ec83}
.stat.gem{color:#df9cff}
.stat.star{color:#ffd95b}

/* ================= SIDE BUTTONS ================= */

.side{
  position:absolute;
  z-index:15;
  top:145px;
  display:flex;
  flex-direction:column;
  gap:13px;
}

.side.left{left:12px}
.side.right{right:12px}

.sideBtn{
  width:92px;
  height:92px;
  border:0;
  border-radius:27px;
  background:rgba(29,53,77,.95);
  color:#fff;
  box-shadow:0 9px 20px rgba(0,0,0,.2);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:14px;
  font-weight:800;
}

.sideBtn span{
  font-size:37px;
  line-height:40px;
}

.sideBtn:active{
  transform:scale(.94);
}

/* ================= BOTTOM NAV ================= */

#bottomNav{
  position:absolute;
  z-index:20;
  left:12px;
  right:12px;
  bottom:max(10px,env(safe-area-inset-bottom));
  height:104px;
  border-radius:29px;
  background:rgba(29,53,67,.96);
  box-shadow:0 -5px 25px rgba(0,0,0,.2);
  padding:8px;
  display:flex;
  gap:8px;
}

.navBtn{
  flex:1;
  min-width:0;
  border:0;
  border-radius:23px;
  background:linear-gradient(#fff,#f3f5f6);
  color:#263d50;
  font-weight:800;
  font-size:13px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}

.navBtn .icon{
  font-size:33px;
  line-height:35px;
}

.navBtn:active{
  transform:scale(.95);
}

/* ================= JOYSTICK ================= */

#joystick{
  position:absolute;
  z-index:18;
  left:32px;
  bottom:140px;
  width:155px;
  height:155px;
  border:3px solid rgba(255,255,255,.48);
  border-radius:50%;
  background:rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:center;
}

#stick{
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(247,250,238,.92);
  box-shadow:0 8px 20px rgba(0,0,0,.18);
}

/* ================= CAMERA HELP ================= */

#cameraHint{
  position:absolute;
  z-index:5;
  left:50%;
  bottom:120px;
  transform:translateX(-50%);
  padding:8px 15px;
  border-radius:20px;
  background:rgba(15,32,46,.48);
  color:white;
  font-size:12px;
  pointer-events:none;
}

/* ================= MODAL ================= */

#modal{
  position:absolute;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(4,16,26,.52);
  backdrop-filter:blur(5px);
}

.panel{
  width:min(92vw,520px);
  max-height:82vh;
  overflow:auto;
  border-radius:28px;
  background:#f7f3ec;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
  padding:20px;
  color:#273b49;
}

.panelHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.panelTitle{
  font-size:25px;
  font-weight:900;
}

.close{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#263e50;
  color:white;
  font-size:22px;
}

.card{
  background:white;
  border-radius:19px;
  padding:13px;
  margin:9px 0;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  display:flex;
  align-items:center;
  gap:12px;
}

.cardIcon{
  width:60px;
  height:60px;
  border-radius:16px;
  background:#e7f0f3;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:35px;
}

.cardInfo{
  flex:1;
}

.cardTitle{
  font-weight:900;
  font-size:16px;
}

.cardSub{
  color:#687986;
  margin-top:3px;
  font-size:13px;
}

.action{
  border:0;
  border-radius:13px;
  padding:10px 13px;
  background:#ffbd36;
  color:white;
  font-weight:900;
}

.action.green{
  background:#42bb6b;
}

.renameBox{
  display:flex;
  gap:8px;
}

.renameBox input{
  flex:1;
  min-width:0;
  padding:13px;
  border-radius:14px;
  border:2px solid #d4dfe3;
  font-size:16px;
}

/* ================= LOADING ================= */

#loading{
  position:absolute;
  inset:0;
  z-index:200;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(#86c2d6,#cfe5db);
}

.loadingBox{
  width:310px;
  padding:28px;
  border-radius:30px;
  text-align:center;
  color:white;
  background:#263e55;
  box-shadow:0 20px 60px rgba(0,0,0,.28);
}

.loadingLogo{
  font-size:65px;
}

.loadingTitle{
  font-size:22px;
  font-weight:900;
  margin:6px 0;
}

.loadingText{
  color:#d4e0e7;
}

.loader{
  margin-top:18px;
  height:8px;
  border-radius:20px;
  overflow:hidden;
  background:#526a7e;
}

.loader i{
  display:block;
  height:100%;
  width:0%;
  background:#5ee4ff;
  animation:load 2s forwards;
}

@keyframes load{
  to{width:100%}
}

/* ================= TOAST ================= */

#toast{
  position:absolute;
  z-index:300;
  left:50%;
  top:105px;
  transform:translateX(-50%) translateY(-20px);
  background:rgba(24,42,57,.94);
  color:white;
  padding:12px 20px;
  border-radius:22px;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= RESPONSIVE ================= */

@media(max-width:700px){

  .profile{
    width:225px;
    min-height:78px;
    border-radius:22px;
    padding:7px;
  }

  .avatar{
    width:57px;
    height:57px;
    font-size:34px;
  }

  .hotelName{
    font-size:17px;
    line-height:19px;
  }

  .level{
    font-size:13px;
  }

  .stats{
    gap:5px;
  }

  .stat{
    min-width:auto;
    height:58px;
    padding:0 9px;
    font-size:15px;
  }

  .stat:nth-child(1){
    display:none;
  }

  .side{
    top:118px;
    gap:9px;
  }

  .sideBtn{
    width:82px;
    height:82px;
    border-radius:24px;
  }

  .sideBtn span{
    font-size:31px;
  }

  #bottomNav{
    height:94px;
    border-radius:26px;
  }

  .navBtn{
    border-radius:20px;
    font-size:11px;
  }

  .navBtn .icon{
    font-size:29px;
  }

  #joystick{
    width:135px;
    height:135px;
    left:23px;
    bottom:116px;
  }

  #stick{
    width:62px;
    height:62px;
  }

  #cameraHint{
    display:none;
  }
}

@media(max-width:430px){

  .profile{
    width:210px;
  }

  .stat{
    height:52px;
    padding:0 7px;
    font-size:13px;
  }

  .sideBtn{
    width:76px;
    height:76px;
  }

  #bottomNav{
    gap:5px;
    padding:6px;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<!-- ================= TOP ================= -->

<div id="topUI">

  <div class="profile">
    <div class="avatar">👩🏻</div>

    <div class="profileText">
      <div class="hotelName" id="hotelNameUI">
        Hotel BuSan KhacChieu
      </div>

      <div class="level">
        Lv. 5 · <span id="xpText">320/600</span> XP
      </div>

      <div class="xpbar">
        <div class="xpfill" id="xpFill"></div>
      </div>
    </div>
  </div>

  <div class="stats">

    <div class="stat money">
      💵 <span id="money">12,580</span>
    </div>

    <div class="stat gem">
      💎 <span id="gems">245</span>
    </div>

    <div class="stat star">
      ⭐ <span id="rating">4.8</span>
    </div>

  </div>

</div>

<!-- ================= LEFT ================= -->

<div class="side left">

  <button class="sideBtn" onclick="openPanel('mission')">
    <span>📋</span>
    Nhiệm vụ
  </button>

  <button class="sideBtn" onclick="openPanel('gift')">
    <span>🎁</span>
    Quà
  </button>

  <button class="sideBtn" onclick="openPanel('vip')">
    <span>👑</span>
    VIP
  </button>

</div>

<!-- ================= RIGHT ================= -->

<div class="side right">

  <button class="sideBtn" onclick="cameraMode()">
    <span>🎥</span>
    Camera
  </button>

  <button class="sideBtn" onclick="openPanel('map')">
    <span>🗺️</span>
    Bản đồ
  </button>

  <button class="sideBtn" onclick="toggleNight()">
    <span id="dayIcon">🌙</span>
    <span style="font-size:14px">Ngày/Đêm</span>
  </button>

</div>

<!-- ================= JOYSTICK ================= -->

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="cameraHint">
  Kéo màn hình để xoay camera · Chụm để zoom
</div>

<!-- ================= BOTTOM ================= -->

<div id="bottomNav">

  <button class="navBtn" onclick="openPanel('hotel')">
    <div class="icon">🏨</div>
    Khách sạn
  </button>

  <button class="navBtn" onclick="openPanel('rooms')">
    <div class="icon">🛏️</div>
    Phòng
  </button>

  <button class="navBtn" onclick="openPanel('restaurant')">
    <div class="icon">🍽️</div>
    Nhà hàng
  </button>

  <button class="navBtn" onclick="openPanel('pool')">
    <div class="icon">🏊</div>
    Hồ bơi
  </button>

  <button class="navBtn" onclick="openPanel('staff')">
    <div class="icon">👨🏻</div>
    Nhân viên
  </button>

  <button class="navBtn" onclick="openPanel('upgrade')">
    <div class="icon">✏️</div>
    Đổi tên
  </button>

</div>

<!-- ================= MODAL ================= -->

<div id="modal">

  <div class="panel">

    <div class="panelHead">
      <div class="panelTitle" id="panelTitle"></div>
      <button class="close" onclick="closePanel()">×</button>
    </div>

    <div id="panelContent"></div>

  </div>

</div>

<!-- ================= TOAST ================= -->

<div id="toast"></div>

<!-- ================= LOADING ================= -->

<div id="loading">

  <div class="loadingBox">

    <div class="loadingLogo">🏨</div>

    <div class="loadingTitle">
      Hotel BuSan KhacChieu 3D
    </div>

    <div class="loadingText">
      Đang dựng khách sạn...
    </div>

    <div class="loader">
      <i></i>
    </div>

  </div>

</div>

</div>

<!-- =========================================================
     THREE.JS
========================================================= -->

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";

import {
  OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
  RoundedBoxGeometry
} from "three/addons/geometries/RoundedBoxGeometry.js";


/* =========================================================
   BASIC
========================================================= */

const canvas = document.getElementById("canvas");

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.outputColorSpace=THREE.SRGBColorSpace;

renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background=new THREE.Color("#8ec6d8");

scene.fog=new THREE.Fog(
  "#8ec6d8",
  45,
  130
);


/* =========================================================
   CAMERA
========================================================= */

const camera = new THREE.PerspectiveCamera(
  48,
  window.innerWidth/window.innerHeight,
  .1,
  300
);

camera.position.set(
  32,
  25,
  36
);


/* =========================================================
   CONTROLS
========================================================= */

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.target.set(
  0,
  7,
  0
);

controls.enableDamping=true;
controls.dampingFactor=.07;

controls.minDistance=18;
controls.maxDistance=70;

controls.maxPolarAngle=Math.PI*.48;
controls.minPolarAngle=.35;

controls.enablePan=false;


/* =========================================================
   LIGHTS
========================================================= */

const hemi = new THREE.HemisphereLight(
  "#fff4dc",
  "#557060",
  2.1
);

scene.add(hemi);


const sun = new THREE.DirectionalLight(
  "#fff3d0",
  4
);

sun.position.set(
  -35,
  55,
  30
);

sun.castShadow=true;

sun.shadow.mapSize.set(
  2048,
  2048
);

sun.shadow.camera.left=-55;
sun.shadow.camera.right=55;
sun.shadow.camera.top=55;
sun.shadow.camera.bottom=-55;

sun.shadow.bias=-.0003;

scene.add(sun);


/* =========================================================
   NIGHT LIGHT
========================================================= */

const nightLight = new THREE.DirectionalLight(
  "#6589ff",
  0
);

nightLight.position.set(
  20,
  45,
  -30
);

scene.add(nightLight);


/* =========================================================
   MATERIAL HELPERS
========================================================= */

function mat(color,roughness=.8,metalness=0){

  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness
  });

}

function box(
  w,
  h,
  d,
  color,
  x=0,
  y=0,
  z=0,
  radius=.12
){

  const g=new RoundedBoxGeometry(
    w,h,d,
    3,
    radius
  );

  const m=new THREE.Mesh(
    g,
    mat(color)
  );

  m.position.set(x,y,z);

  m.castShadow=true;
  m.receiveShadow=true;

  scene.add(m);

  return m;
}


/* =========================================================
   GROUND
========================================================= */

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(180,180),
  mat("#8eb66e")
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);


/* =========================================================
   ROAD
========================================================= */

const road=box(
  100,
  .18,
  18,
  "#333a3c",
  0,
  .09,
  27,
  .03
);

for(let x=-45;x<=45;x+=8){

  box(
    4,
    .03,
    .45,
    "#f7e8a5",
    x,
    .2,
    27,
    .01
  );

}


/* =========================================================
   HOTEL MAIN BODY
========================================================= */

const hotel = new THREE.Group();

scene.add(hotel);


function hotelFloor(y,color){

  const floor=box(
    25,
    5.2,
    16,
    color,
    0,
    y,
    0,
    .35
  );

  hotel.add(floor);

  /* windows */

  for(let x=-9;x<=9;x+=6){

    const windowMesh=box(
      3.6,
      2.5,
      .12,
      "#72cce4",
      x,
      y+.1,
      -8.08,
      .08
    );

    windowMesh.material.metalness=.2;
    windowMesh.material.roughness=.15;

    hotel.add(windowMesh);

    box(
      3.8,
      .18,
      .15,
      "#d9d3b0",
      x,
      y-1.3,
      -8.2,
      .03
    );

  }

}


hotelFloor(3.0,"#eee2ce");
hotelFloor(8.5,"#f2e6d1");
hotelFloor(14.0,"#ead9c1");


/* =========================================================
   ROOF
========================================================= */

const roof=box(
  27,
  1,
  18,
  "#60462f",
  0,
  17,
  0,
  .2
);

hotel.add(roof);


/* =========================================================
   HOTEL CENTRAL ENTRANCE
========================================================= */

box(
  9,
  6,
  3,
  "#d6b07b",
  0,
  3,
  -9.4,
  .25
);

const entrance=box(
  5,
  4.4,
  .35,
  "#283b45",
  0,
  3,
  -11.05,
  .1
);

entrance.material.metalness=.15;


/* =========================================================
   HOTEL SIGN
========================================================= */

const sign=box(
  13,
  2.8,
  .45,
  "#241f20",
  0,
  10.3,
  -9.3,
  .18
);

sign.material.emissive=new THREE.Color("#7d3e13");
sign.material.emissiveIntensity=.45;


/* =========================================================
   SIGN TEXT USING CANVAS TEXTURE
========================================================= */

function textTexture(
  text,
  width=900,
  height=220
){

  const c=document.createElement("canvas");

  c.width=width;
  c.height=height;

  const ctx=c.getContext("2d");

  ctx.clearRect(0,0,width,height);

  ctx.fillStyle="#fff1c7";
  ctx.font="bold 90px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    text,
    width/2,
    height/2
  );

  const texture=new THREE.CanvasTexture(c);

  texture.colorSpace=THREE.SRGBColorSpace;

  return texture;
}

const signText=new THREE.Mesh(
  new THREE.PlaneGeometry(11,2.5),
  new THREE.MeshBasicMaterial({
    map:textTexture("HOTEL"),
    transparent:true
  })
);

signText.position.set(
  0,
  10.3,
  -9.58
);

scene.add(signText);


/* =========================================================
   BALCONIES
========================================================= */

for(let floor=0;floor<3;floor++){

  const y=5.5+floor*5.5;

  for(let x=-8;x<=8;x+=8){

    box(
      5.8,
      .18,
      2.3,
      "#a89b82",
      x,
      y,
      -9.3,
      .04
    );

    box(
      5.8,
      1.15,
      .12,
      "#363e40",
      x,
      y+.55,
      -10.35,
      .02
    );

  }

}


/* =========================================================
   PALMS
========================================================= */

function palm(x,z,scale=1){

  const group=new THREE.Group();

  group.position.set(x,0,z);
  group.scale.setScalar(scale);

  scene.add(group);

  const trunk= new THREE.Mesh(
    new THREE.CylinderGeometry(
      .32,
      .48,
      4.5,
      9
    ),
    mat("#8c613b")
  );

  trunk.position.y=2.25;
  trunk.castShadow=true;

  group.add(trunk);


  for(let i=0;i<8;i++){

    const leaf=new THREE.Mesh(

/* =========================================================
   JOYSTICK
========================================================= */

let joystick={
  active:false,
  x:0,
  y:0
};

const joystickEl=document.getElementById("joystick");
const stick=document.getElementById("stick");

function updateStick(clientX,clientY){

  const r=joystickEl.getBoundingClientRect();

  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;

  let dx=clientX-cx;
  let dy=clientY-cy;

  const max=r.width/2-35;

  const len=Math.hypot(dx,dy);

  if(len>max){

    dx=dx/len*max;
    dy=dy/len*max;

  }

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;

  joystick.x=dx/max;
  joystick.y=dy/max;

}

joystickEl.addEventListener(
  "pointerdown",
  e=>{
    joystick.active=true;
    joystickEl.setPointerCapture(e.pointerId);
    updateStick(e.clientX,e.clientY);
  }
);

joystickEl.addEventListener(
  "pointermove",
  e=>{
    if(joystick.active){
      updateStick(e.clientX,e.clientY);
    }
  }
);

joystickEl.addEventListener(
  "pointerup",
  ()=>{
    joystick.active=false;
    joystick.x=0;
    joystick.y=0;
    stick.style.transform="";
  }
);


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

const clock=new THREE.Clock();

function updatePlayer(dt){

  if(!joystick.active)return;

  const speed=7;

  const forward=new THREE.Vector3();
  camera.getWorldDirection(forward);

  forward.y=0;
  forward.normalize();

  const right=new THREE.Vector3();
  right.crossVectors(
    forward,
    new THREE.Vector3(0,1,0)
  ).normalize();

  const move=new THREE.Vector3();

  move.addScaledVector(
    forward,
    -joystick.y
  );

  move.addScaledVector(
    right,
    joystick.x
  );

  if(move.lengthSq()>.01){

    move.normalize();

    player.position.addScaledVector(
      move,
      speed*dt
    );

    player.position.x=
      THREE.MathUtils.clamp(
        player.position.x,
        -32,
        32
      );

    player.position.z=
      THREE.MathUtils.clamp(
        player.position.z,
        -30,
        35
      );

    player.rotation.y=
      Math.atan2(
        move.x,
        move.z
      );

  }

}


/* =========================================================
   NPC MOVEMENT
========================================================= */

function updateNPC(dt,time){

  npcs.forEach(n=>{

    n.angle+=Math.sin(
      time*.5+n.phase
    )*.002;

    const dx=Math.cos(n.angle)*n.speed*dt;
    const dz=Math.sin(n.angle)*n.speed*dt;

    n.object.position.x+=dx;
    n.object.position.z+=dz;

    if(Math.abs(n.object.position.x)>30)
      n.angle=Math.PI-n.angle;

    if(Math.abs(n.object.position.z)>30)
      n.angle=-n.angle;

    n.object.rotation.y=
      Math.atan2(dx,dz);

    n.object.position.y=
      Math.sin(time*7+n.phase)*.025;

  });

}

    input.value.trim();

  if(!name){

    showToast("Hãy nhập tên khách sạn");

    return;

  }

  document.getElementById(
    "hotelNameUI"
  ).textContent=name;

  closePanel();

  showToast("🏨 Đã đổi tên khách sạn");

};


window.claimGift=function(){

  money+=500;
  gems+=10;

  updateUI();

  showToast(
    "🎁 +$500 · 💎 +10"
  );

};


window.rewardGems=function(amount=10){

  gems+=amount;

  updateUI();

  showToast(
    `💎 +${amount} kim cương`
  );

};


window.completeMission=function(){

  xp+=500;

  if(xp>=600){
    xp-=600;
  }

  updateUI();

  showToast(
    "📋 Hoàn thành nhiệm vụ +500 XP"
  );

};


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

window.showToast=function(text){

  const toast=
    document.getElementById("toast");

  toast.textContent=text;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    toast.classList.remove("show");
  },2200);

};


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      window.innerWidth/
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


/* =========================================================
   LOADING
========================================================= */

setTimeout(()=>{

  document.getElementById(
    "loading"
  ).style.opacity="0";

  document.getElementById(
    "loading"
  ).style.pointerEvents="none";

  setTimeout(()=>{
    document.getElementById(
      "loading"
    ).remove();
  },500);

},2100);


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(){

  requestAnimationFrame(animate);

  const dt=Math.min(
    clock.getDelta(),
    .05
  );

  const time=performance.now()/1000;

  updatePlayer(dt);

  updateNPC(dt,time);

  animateWater(time);

  controls.update();

  renderer.render(
    scene,
    camera
  );

}

animate();

</script>

</body>
</html>
