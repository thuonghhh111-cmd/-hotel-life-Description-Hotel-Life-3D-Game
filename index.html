<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hotel Life 3D Game</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
    overflow-x: hidden;
}

button {
    border: none;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

#game {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 20%, #31486b 0%, #172238 40%, #0b101b 100%);
}

/* HEADER */

header {
    position: sticky;
    top: 0;
    z-index: 20;
    padding: 12px;
    background: rgba(8, 13, 24, .92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #33415c;
}

.title {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.title h1 {
    margin: 0;
    font-size: 22px;
}

.level {
    background: #e9b949;
    color: #171717;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 13px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-top: 10px;
}

.stat {
    background: #1d2940;
    border: 1px solid #35445f;
    border-radius: 12px;
    padding: 8px;
    text-align: center;
    font-size: 13px;
}

.stat b {
    display: block;
    font-size: 16px;
    margin-top: 3px;
}

/* HOTEL */

.hotel {
    width: 94%;
    max-width: 700px;
    margin: 18px auto;
}

.sky {
    height: 110px;
    border-radius: 20px 20px 0 0;
    background: linear-gradient(#405c83, #8099b6);
    position: relative;
    overflow: hidden;
}

.moon {
    position: absolute;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #fff4bd;
    right: 30px;
    top: 20px;
    box-shadow: 0 0 30px #fff4bd;
}

.hotel-building {
    background: #d8d3c5;
    border: 5px solid #a9a28e;
    min-height: 400px;
    position: relative;
    padding: 20px 12px 30px;
}

.roof {
    height: 35px;
    background: #7d2630;
    margin: -20px -12px 15px;
    border-bottom: 6px solid #592029;
}

.hotel-name {
    text-align: center;
    color: #4c2630;
    font-family: Georgia, serif;
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 15px;
}

.rooms {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
}

.room {
    min-height: 95px;
    border: 3px solid #7c7364;
    border-radius: 7px;
    background: #f0eadb;
    padding: 8px;
    color: #3b352e;
    position: relative;
}

.room.active {
    background: #e6f4ff;
    border-color: #4a91c7;
}

.room.dirty {
    background: #ead3bd;
    border-color: #9b6d43;
}

.room-number {
    font-size: 12px;
    font-weight: bold;
}

.bed {
    width: 55px;
    height: 28px;
    background: #fff;
    border: 3px solid #8c8273;
    margin: 8px auto 3px;
    border-radius: 5px;
}

.room-status {
    text-align: center;
    font-size: 10px;
    font-weight: bold;
}

/* ACTIONS */

.panel {
    width: 94%;
    max-width: 700px;
    margin: 15px auto;
}

.panel h2 {
    font-size: 18px;
    margin: 10px 0;
}

.actions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.action {
    padding: 16px 10px;
    border-radius: 15px;
    background: #263650;
    color: white;
    border: 1px solid #435575;
    box-shadow: 0 5px 0 #141e30;
}

.action:active {
    transform: translateY(4px);
    box-shadow: none;
}

.action span {
    display: block;
    font-size: 28px;
    margin-bottom: 5px;
}

.gold {
    background: #c99732;
    color: #171717;
}

.green {
    background: #267d59;
}

.blue {
    background: #326fa3;
}

.red {
    background: #963f4b;
}

/* GUESTS */

.guest {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    margin: 8px 0;
    background: #1c283d;
    border: 1px solid #35445d;
    border-radius: 14px;
}

.avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #d9a441;
    font-size: 24px;
}

.guest-info {
    flex: 1;
}

.guest-info b {
    display: block;
}

.guest-info small {
    color: #aebbd0;
}

/* LOG */

#log {
    background: #090e18;
    border-radius: 14px;
    padding: 12px;
    max-height: 150px;
    overflow-y: auto;
    font-size: 13px;
    color: #c5d0e0;
}

.log-item {
    padding: 5px 0;
    border-bottom: 1px solid #202b3d;
}

/* POPUP */

#popup {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
}

.popup-box {
    width: 100%;
    max-width: 400px;
    background: #202c42;
    border: 1px solid #536987;
    border-radius: 20px;
    padding: 22px;
    text-align: center;
}

.popup-box h2 {
    margin-top: 0;
}

.close {
    margin-top: 15px;
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    background: #d7a53e;
}

/* MOBILE */

@media (max-width: 450px) {
    .rooms {
        gap: 6px;
    }

    .room {
        min-height: 83px;
        padding: 5px;
    }

    .bed {
        width: 45px;
    }

    .hotel-building {
        min-height: 350px;
    }
}
</style>
</head>

<body>

<div id="game">

<header>
    <div class="title">
        <h1>🏨 Hotel Life</h1>
        <div class="level">⭐ Cấp <span id="level">1</span></div>
    </div>

    <div class="stats">
        <div class="stat">
            💰 Tiền
            <b id="money">500</b>
        </div>

        <div class="stat">
            ⭐ Danh tiếng
            <b id="reputation">50</b>
        </div>

        <div class="stat">
            👥 Khách
            <b id="guestsCount">0</b>
        </div>
    </div>
</header>


<section class="hotel">

    <div class="sky">
        <div class="moon"></div>
    </div>

    <div class="hotel-building">

        <div class="roof"></div>

        <div class="hotel-name">
            HOTEL LIFE
        </div>

        <div class="rooms" id="rooms"></div>

    </div>

</section>


<section class="panel">

    <h2>🎮 Quản lý khách sạn</h2>

    <div class="actions">

        <button class="action gold" onclick="checkIn()">
            <span>🧳</span>
            Nhận khách
        </button>

        <button class="action green" onclick="cleanRoom()">
            <span>🧹</span>
            Dọn phòng
        </button>

        <button class="action blue" onclick="upgradeHotel()">
            <span>🏗️</span>
            Nâng cấp
        </button>

        <button class="action red" onclick="advertise()">
            <span>📢</span>
            Quảng cáo
        </button>

    </div>

</section>


<section class="panel">

    <h2>👥 Khách đang ở</h2>

    <div id="guestList">
        <p style="color:#9eacc1">
            Chưa có khách nào.
        </p>
    </div>

</section>


<section class="panel">

    <h2>📜 Nhật ký khách sạn</h2>

    <div id="log">
        <div class="log-item">
            🏨 Chào mừng bạn đến với Hotel Life!
        </div>

        <div class="log-item">
            💡 Hãy nhận khách để bắt đầu kiếm tiền.
        </div>
    </div>

</section>

</div>


<div id="popup">

    <div class="popup-box">

        <h2 id="popupTitle">Thông báo</h2>

        <p id="popupText"></p>

        <button class="close" onclick="closePopup()">
            OK
        </button>

    </div>

</div>


<script>

/* =========================
   GAME DATA
========================= */

let money = 500;
let reputation = 50;
let level = 1;

let roomCount = 6;
let rooms = [];

let guests = [];

let guestNames = [
    "Minh",
    "An",
    "Linh",
    "Nam",
    "Mai",
    "Huy",
    "Vy",
    "Khang",
    "Thảo",
    "Quân"
];

let guestFaces = [
    "😀",
    "😎",
    "🙂",
    "🤩",
    "😊",
    "😄",
    "🥰"
];


/* =========================
   SAVE / LOAD
========================= */

function saveGame() {

    localStorage.setItem(
        "hotelLifeSave",
        JSON.stringify({
            money,
            reputation,
            level,
            roomCount,
            rooms,
            guests
        })
    );

}


function loadGame() {

    const save =
        localStorage.getItem("hotelLifeSave");

    if (!save) {

        rooms = Array(roomCount).fill("clean");

        return;
    }

    try {

        const data = JSON.parse(save);

        money = data.money ?? 500;
        reputation = data.reputation ?? 50;
        level = data.level ?? 1;
        roomCount = data.roomCount ?? 6;
        rooms = data.rooms ?? Array(roomCount).fill("clean");
        guests = data.guests ?? [];

    } catch {

        rooms = Array(roomCount).fill("clean");

    }

}


/* =========================
   DISPLAY
========================= */

function updateUI() {

    document.getElementById("money").textContent =
        money;

    document.getElementById("reputation").textContent =
        reputation;

    document.getElementById("level").textContent =
        level;

    document.getElementById("guestsCount").textContent =
        guests.length;

    renderRooms();
    renderGuests();

    saveGame();
}


/* =========================
   ROOMS
========================= */

function renderRooms() {

    const container =
        document.getElementById("rooms");

    container.innerHTML = "";

    rooms.forEach((status, index) => {

        const room =
            document.createElement("div");

        room.className =
            "room " +
            (status === "occupied" ? "active " : "") +
            (status === "dirty" ? "dirty" : "");

        let text = "Trống";

        if (status === "occupied")
            text = "Có khách";

        if (status === "dirty")
            text = "Cần dọn";

        room.innerHTML = `
            <div class="room-number">
                Phòng ${index + 101}
            </div>

            <div class="bed"></div>

            <div class="room-status">
                ${text}
            </div>
        `;

        container.appendChild(room);

    });

}


/* =========================
   GUESTS
========================= */

function renderGuests() {

    const list =
        document.getElementById("guestList");

    if (guests.length === 0) {

        list.innerHTML =
            `<p style="color:#9eacc1">
                Chưa có khách nào.
            </p>`;

        return;
    }

    list.innerHTML = "";

    guests.forEach((guest, index) => {

        const div =
            document.createElement("div");

        div.className = "guest";

        div.innerHTML = `
            <div class="avatar">
                ${guest.face}
            </div>

            <div class="guest-info">
                <b>${guest.name}</b>
                <small>
                    Phòng ${guest.room + 101}
                    · ${guest.nights} đêm
                </small>
            </div>

            <button
                onclick="checkout(${index})"
                style="
                    padding:8px;
                    border-radius:9px;
                    background:#d3a443;
                "
            >
                Trả phòng
            </button>
        `;

        list.appendChild(div);

    });

}


/* =========================
   CHECK IN
========================= */

function checkIn() {

    const freeRoom =
        rooms.findIndex(
            r => r === "clean"
        );

    if (freeRoom === -1) {

        showPopup(
            "Hết phòng!",
            "Tất cả phòng đang có khách hoặc cần dọn."
        );

        return;
    }

    const name =
        guestNames[
            Math.floor(
                Math.random() *
                guestNames.length
            )
        ];

    const face =
        guestFaces[
            Math.floor(
                Math.random() *
                guestFaces.length
            )
        ];

    const guest = {

        name,
        face,
        room: freeRoom,
        nights: 1

    };

    guests.push(guest);

    rooms[freeRoom] = "occupied";

    reputation += 2;

    addLog(
        `🧳 ${name} đã nhận phòng ${freeRoom + 101}.`
    );

    updateUI();

    checkLevel();

}


/* =========================
   CHECK OUT
========================= */

function checkout(index) {

    const guest =
        guests[index];

    const earned =
        100 + level * 20;

    money += earned;

    reputation += 3;

    rooms[guest.room] = "dirty";

    guests.splice(index, 1);

    addLog(
        `💰 ${guest.name} trả phòng. Bạn nhận ${earned} xu.`
    );

    updateUI();

    checkLevel();

}


/* =========================
   CLEAN ROOM
========================= */

function cleanRoom() {

    const dirty =
        rooms.findIndex(
            r => r === "dirty"
        );

    if (dirty === -1) {

        showPopup(
            "Không cần dọn!",
            "Hiện không có phòng bẩn."
        );

        return;
    }

    rooms[dirty] = "clean";

    addLog(
        `🧹 Đã dọn phòng ${dirty + 101}.`
    );

    updateUI();

}


/* =========================
   UPGRADE
========================= */

function upgradeHotel() {

    const cost =
        400 + level * 250;

    if (money < cost) {

        showPopup(
            "Không đủ tiền",
            `Cần ${cost} xu để nâng cấp.`
        );

        return;
    }

    money -= cost;

    level++;

    roomCount += 2;

    rooms.push("clean");
    rooms.push("clean");

    reputation += 5;

    addLog(
        `🏗️ Khách sạn đã lên cấp ${level}!`
    );

    updateUI();

}


/* =========================
   ADVERTISE
========================= */

function advertise() {

    const cost = 100;

    if (money < cost) {

        showPopup(
            "Không đủ tiền",
            "Cần 100 xu để quảng cáo."
        );

        return;
    }

    money -= cost;

    reputation += 10;

    addLog(
        "📢 Chiến dịch quảng cáo thành công! Danh tiếng +10."
    );

    updateUI();

}


/* =========================
   LEVEL
========================= */

function checkLevel() {

    const required =
        level * 100;

    if (reputation >= required) {

        level++;

        reputation += 10;

        showPopup(
            "🎉 LÊN CẤP!",
            `Khách sạn đạt cấp ${level}!`
        );

        addLog(
            `⭐ Chúc mừng! Bạn đã đạt cấp ${level}.`
        );

        updateUI();
    }

}


/* =========================
   LOG
========================= */

function addLog(message) {

    const log =
        document.getElementById("log");

    const item =
        document.createElement("div");

    item.className = "log-item";

    item.textContent = message;

    log.prepend(item);

    while (log.children.length > 12) {

        log.removeChild(
            log.lastChild
        );

    }

}


/* =========================
   POPUP
========================= */

function showPopup(title, text) {

    document.getElementById(
        "popupTitle"
    ).textContent = title;

    document.getElementById(
        "popupText"
    ).textContent = text;

    document.getElementById(
        "popup"
    ).style.display = "flex";

}


function closePopup() {

    document.getElementById(
        "popup"
    ).style.display = "none";

}


/* =========================
   PASSIVE INCOME
========================= */

setInterval(() => {

    if (guests.length > 0) {

        const income =
            guests.length * 10;

        money += income;

        addLog(
            `💵 Khách sạn kiếm được ${income} xu.`
        );

        updateUI();

    }

}, 15000);


/* =========================
   START GAME
========================= */

loadGame();

updateUI();

</script>

</body>
</html>
